architecture:
  mode: monorepo-single-build
  build_root: "."
  hub_route: "/"
  deep_linking: required
  module_style_isolation: required
  notes: "Build único en la raíz, puerto 4330. El Hub es la home y cada módulo cuelga de una ruta interna. Tres ámbitos de estilo aislados: tokens.css (:root), shell.tokens.css ([data-shell]) y home.tokens.css ([data-module='home'])."
  routes:
    - path: "/"
      module: hub
    - path: "/prototipo"
      module: prototype
    - path: "/prototipo/home"
      module: prototype
    - path: "/prototipo/notificaciones"
      module: prototype
    - path: "/documentacion"
      module: documentation
    - path: "/documentacion/:docId"
      module: documentation

documentation:
  source_mode: source-documents
  module_path: "documentation"
  canonical_source: "documentation/00-INDICE.md"
  external_sources: []
  change_log: "documentation/05-REGISTRO-DE-CAMBIOS.md"

